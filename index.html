    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is title case?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Title case is a capitalization style where major words (nouns, verbs, adjectives) are capitalized while minor words (articles, short prepositions, coordinating conjunctions) stay lowercase — except the first and last words, which are always capitalized."
            }
          },
          {
            "@type": "Question",
            "name": "Which style guide should I use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Use AP for news and journalism, APA for academic papers in social sciences, Chicago for books and general publishing, and MLA for humanities essays. When in doubt, Chicago is the most widely accepted."
            }
          },
          {
            "@type": "Question",
            "name": "What is the difference between AP, APA, Chicago and MLA title case?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "They mostly agree; the key difference is long prepositions. AP and APA capitalize prepositions of four or more letters (Walking Through the Park), while Chicago and MLA lowercase all prepositions (Walking through the Park)."
            }
          },
          {
            "@type": "Question",
            "name": "Are words after a colon capitalized?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — in all four style guides the first word after a colon in a title is capitalized, even if it is a minor word: The Fellowship: A New Hope."
            }
          },
          {
            "@type": "Question",
            "name": "Does this work for hyphenated words?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The converter applies the minor-word rules to each part of a hyphenated compound: Mother-in-Law, State-of-the-Art. The first part is always capitalized."
            }
          },
          {
            "@type": "Question",
            "name": "Can I convert multiple headlines at once?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Batch mode converts one headline per line under all four style guides instantly, with one-click copy for the entire result list — ideal for spreadsheets, CMS imports and editorial checklists."
            }
          },
          {
            "@type": "Question",
            "name": "Can it check whether my headline capitalization is correct?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The Case Detective mode grades a finished headline word by word against AP, APA, Chicago or MLA, marks every wrongly-cased word in red with the correction, and copies the fixed title in one click."
            }
          }
        ]
      }
